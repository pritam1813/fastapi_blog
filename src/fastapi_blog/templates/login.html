{% extends "layout.html" %}

{% block content %}
<div class="max-w-md mx-auto my-8 sm:my-12">
    <!-- Card Container -->
    <div class="p-6 sm:p-8 rounded-xl bg-white dark:bg-navy-900 border border-navy-900/10 dark:border-navy-700 shadow-md">
        <!-- Header -->
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-xl bg-navy-900 text-cream-100 dark:bg-cream-100 dark:text-navy-950 mx-auto flex items-center justify-center mb-3.5 shadow-xs">
                <i data-lucide="log-in" class="w-6 h-6"></i>
            </div>
            <h1 class="text-2xl font-bold tracking-tight text-navy-950 dark:text-cream-100">Welcome Back</h1>
            <p class="text-xs sm:text-sm text-navy-700/70 dark:text-cream-100/60 mt-1">
                Enter your credentials to access your account
            </p>
        </div>

        <!-- Info Alert Container (e.g. expired session) -->
        <div id="login-info-alert" class="hidden mb-5 p-3.5 rounded-lg bg-navy-900/5 dark:bg-navy-700/30 border border-navy-900/10 dark:border-navy-700 text-xs sm:text-sm text-navy-700 dark:text-cream-100/80">
            <div class="flex items-start gap-2.5">
                <i data-lucide="info" class="w-4 h-4 text-navy-700 dark:text-cream-100/70 shrink-0 mt-0.5"></i>
                <div id="login-info-message"></div>
            </div>
        </div>

        <!-- Error Alert Container -->
        <div id="login-error-alert" class="hidden mb-5 p-3.5 rounded-lg bg-red-500/10 border border-red-500/20 text-xs sm:text-sm text-red-700 dark:text-red-300">
            <div class="flex items-start gap-2.5">
                <i data-lucide="alert-circle" class="w-4 h-4 text-red-600 dark:text-red-400 shrink-0 mt-0.5"></i>
                <div id="login-error-message" class="space-y-1"></div>
            </div>
        </div>

        <!-- Form -->
        <form id="login-form" class="space-y-4">
            <!-- Email Field (Used as OAuth2 username) -->
            <div>
                <label for="login-email" class="block text-xs font-bold uppercase tracking-wider text-navy-950 dark:text-cream-100 mb-1.5">
                    Email Address <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <input type="email"
                           id="login-email"
                           name="email"
                           required
                           placeholder="you@example.com"
                           autocomplete="email"
                           class="w-full px-3.5 py-2.5 text-sm rounded-md bg-[#faf6ed] dark:bg-navy-950/60 border border-navy-900/15 dark:border-navy-700 text-navy-950 dark:text-cream-100 placeholder:text-navy-700/50 dark:placeholder:text-cream-100/40 focus:outline-hidden focus:border-navy-900 dark:focus:border-cream-100 transition-colors">
                </div>
            </div>

            <!-- Password Field -->
            <div>
                <label for="login-password" class="block text-xs font-bold uppercase tracking-wider text-navy-950 dark:text-cream-100 mb-1.5">
                    Password <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <input type="password"
                           id="login-password"
                           name="password"
                           required
                           placeholder="••••••••"
                           autocomplete="current-password"
                           class="w-full px-3.5 py-2.5 text-sm rounded-md bg-[#faf6ed] dark:bg-navy-950/60 border border-navy-900/15 dark:border-navy-700 text-navy-950 dark:text-cream-100 placeholder:text-navy-700/50 dark:placeholder:text-cream-100/40 focus:outline-hidden focus:border-navy-900 dark:focus:border-cream-100 transition-colors">
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit"
                    id="login-submit-btn"
                    class="w-full mt-2 py-2.5 px-4 text-sm font-semibold rounded-md bg-navy-900 text-cream-100 hover:bg-navy-700 dark:bg-cream-100 dark:text-navy-950 dark:hover:bg-cream-100/90 transition-colors cursor-pointer shadow-xs disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
                <span id="login-submit-text">Log in</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Footer / Link to Register -->
        <div class="mt-6 pt-5 border-t border-navy-900/10 dark:border-navy-700 text-center text-xs text-navy-700/70 dark:text-cream-100/60">
            Don't have an account?
            <a href="/register" class="font-bold text-navy-950 dark:text-cream-100 hover:underline ml-1">
                Register here
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const loginForm = document.getElementById("login-form");
    const emailInput = document.getElementById("login-email");
    const passwordInput = document.getElementById("login-password");
    const submitBtn = document.getElementById("login-submit-btn");
    const submitText = document.getElementById("login-submit-text");
    const errorAlert = document.getElementById("login-error-alert");
    const errorMessage = document.getElementById("login-error-message");
    const infoAlert = document.getElementById("login-info-alert");
    const infoMessage = document.getElementById("login-info-message");

    const params = new URLSearchParams(window.location.search);

    // Only allow same-origin paths to avoid open redirects via ?next=
    function safeNext(value) {
        if (!value) return "/";
        try {
            const url = new URL(value, window.location.origin);
            if (url.origin !== window.location.origin) return "/";
            if (url.pathname === "/login" || url.pathname === "/register") return "/";
            return url.pathname + url.search + url.hash;
        } catch {
            return "/";
        }
    }

    const nextUrl = safeNext(params.get("next"));

    if (params.get("reason") === "session_expired" && infoAlert && infoMessage) {
        infoMessage.textContent = "Your session expired. Please log in again.";
        infoAlert.classList.remove("hidden");
        if (window.lucide) window.lucide.createIcons();
    }

    // Already signed in? Send them back to where they were going.
    if (window.Auth) {
        window.Auth.ready.then((user) => {
            if (user) window.location.replace(nextUrl);
        });
    }

    function showError(msg) {
        if (!errorAlert || !errorMessage) return;
        errorMessage.innerHTML = "";
        if (Array.isArray(msg)) {
            const ul = document.createElement("ul");
            ul.className = "list-disc list-inside space-y-1";
            msg.forEach(m => {
                const li = document.createElement("li");
                li.textContent = m;
                ul.appendChild(li);
            });
            errorMessage.appendChild(ul);
        } else {
            errorMessage.textContent = msg;
        }
        errorAlert.classList.remove("hidden");
    }

    function clearError() {
        if (!errorAlert) return;
        errorAlert.classList.add("hidden");
        if (errorMessage) errorMessage.innerHTML = "";
    }

    if (loginForm) {
        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearError();

            const email = emailInput.value.trim();
            const password = passwordInput.value;

            if (!email || !password) {
                showError("Please enter both email and password.");
                return;
            }

            submitBtn.disabled = true;
            submitText.textContent = "Logging in...";

            try {
                // OAuth2PasswordRequestForm expects application/x-www-form-urlencoded
                // The backend compares form_data.username against User.email
                const formData = new URLSearchParams();
                formData.append("username", email);
                formData.append("password", password);

                const response = await fetch("/api/users/token", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/x-www-form-urlencoded",
                        "Accept": "application/json"
                    },
                    body: formData.toString()
                });

                if (!response.ok) {
                    let errJson = null;
                    try {
                        errJson = await response.json();
                    } catch {
                        errJson = { detail: `Server error (${response.status})` };
                    }

                    if (typeof errJson.detail === "string") {
                        showError(errJson.detail);
                    } else if (Array.isArray(errJson.detail)) {
                        showError(errJson.detail.map(item => item.msg || "Validation error"));
                    } else {
                        showError("Failed to authenticate. Please check your credentials.");
                    }
                    return;
                }

                const data = await response.json();

                if (window.Auth) {
                    window.Auth.saveToken(data);
                    try {
                        const me = await window.Auth.apiFetch("/api/users/me", {
                            headers: { Accept: "application/json" }
                        });
                        if (me.ok) window.Auth.setUser(await me.json());
                    } catch {
                        // The next page will hydrate the user from /api/users/me
                    }
                } else {
                    localStorage.setItem("access_token", data.access_token);
                }

                window.location.href = nextUrl;

            } catch (err) {
                showError(err.message || "A network error occurred. Please try again.");
            } finally {
                submitBtn.disabled = false;
                submitText.textContent = "Log in";
            }
        });
    }
});
</script>
{% endblock content %}
